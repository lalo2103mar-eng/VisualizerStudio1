name: Visualizer Studio Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Construir aplicación web
        run: npm run build

      - name: Crear plataforma Android
        run: npx cap add android
     
      - name: Integrar biblioteca musical nativa
        run: |
          mkdir -p android/app/src/main/java/com/visualizerstudio/app

          cp native/android/com/visualizerstudio/app/MusicLibraryPlugin.java android/app/src/main/java/com/visualizerstudio/app/

          cat > android/app/src/main/java/com/visualizerstudio/app/MainActivity.java <<'EOF'
          package com.visualizerstudio.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MusicLibraryPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); marker="<application"; permissions="    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n"; assert marker in s; p.write_text(s.replace(marker, permissions+marker, 1))'


      - name: Sincronizar Android
        run: npx cap sync android

      - name: Construir APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VisualizerStudio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
